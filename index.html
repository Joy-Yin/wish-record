<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲抽卡紀錄系統</title>
    <link href="./style.css" rel="stylesheet">

</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 form-container">
                <h3 class="mb-4 text-center text-primary">🎲 抽卡紀錄系統<span>&nbsp;&nbsp;&nbsp;version 1.0</span></h3>


                <!-- 模式切換頁籤 -->
                <div class="mb-3" id="modeblock">
                    <div class="col-6 mb-3 mode-tab active" id="tabSingle">單抽入魂!!</div>
                    <div class="col-6 mb-3 mode-tab" id="tabMulti">十連雙金!!</div>
                </div>

                <form id="gachaForm" style="clear: both;">
                    <!-- 玩家名稱 -->
                    <div class="mb-3">
                        <label class="form-label">玩家</label>
                        <select class="form-select" id="playerName" required>
                            <option value="" disabled selected>請選擇你是誰...</option>
                            <option value="琥珀">琥珀</option>
                            <option value="冥">冥</option>
                        </select>
                    </div>

                    <!-- 遊戲名稱 -->
                    <div class="mb-3">
                        <label class="form-label">遊戲名稱</label>
                        <select class="form-select" id="gameName" required>
                            <option value="" disabled selected>請選擇遊戲名稱</option>
                            <option value="原神">原神</option>
                            <option value="崩鐵">崩鐵</option>
                            <option value="絕區零">絕區零</option>
                        </select>
                    </div>

                    <!-- 抽卡池 -->
                    <div class="mb-3">
                        <label class="form-label">卡池種類</label>
                        <select class="form-select" id="bannerType" required>
                            <option value="" disabled selected>請選擇卡池種類</option>
                            <option value="限定池">限定池</option>
                            <option value="常駐池">常駐池</option>
                            <option value="武器/光錐池">武器/光錐池</option>
                            <option value="混池">混池</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <hr>

                    <!-- 【區域 A：單抽模式】 -->
                    <div id="singleModeSection">
                        <h5 class="text-secondary mb-3">單抽內容</h5>
                        <div class="mb-3">
                            <label class="form-label">稀有度（星等）</label>
                            <select class="form-select" id="singleRarity">
                                <option value="5星">5星</option>
                                <option value="4星" selected>4星</option>
                                <option value="3星">3星</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">抽到角色 / 武器名稱</label>
                            <!-- 情況 A-1：4星時專用的角色/武器二選一 Radio Buttons -->
                            <div id="single4StarRadioBox" class="mb-3">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="single4StarType" id="radioChar"
                                        value="char" checked>
                                    <label class="form-check-label" for="radioChar">4星角色</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="single4StarType" id="radioWeapon"
                                        value="weapon">
                                    <label class="form-check-label" for="radioWeapon">4星武器/光錐</label>
                                </div>
                            </div>

                            <!-- 4星角色下拉選單 -->
                            <select class="form-select mb-2 hidden" id="singleItemSelectChar"></select>

                            <!-- 4星武器下拉選單 -->
                            <select class="form-select mb-2 hidden" id="singleItemSelectWeapon"></select>

                            <!-- 5星或4星武器選「其他」時顯示的自由輸入框 -->
                            <input type="text" class="form-control hidden" id="singleItemInput"
                                placeholder="請手動輸入名稱...">
                        </div>
                    </div>

                    <!-- 【區域 B：十連抽模式】 -->
                    <div id="multiModeSection" class="hidden">
                        <h5 class="text-secondary mb-3">十連抽內容 (可自行調整 1~10 筆)</h5>
                        <div id="multiRowsContainer">
                            <!-- 10筆抽卡資料列會由 JS 動態生成 -->
                        </div>
                    </div>

                    <!-- 送出按鈕 -->
                    <button type="submit" class="btn btn-primary w-100" id="submitBtn">送出紀錄</button>
                </form>
                <button class="btn btn-primary w-100" id="seeRecord"
                    onclick="window.open('./record.html');">查看紀錄</button>
                <div id="statusMessage" class="mt-3 text-center fw-bold"></div>
            </div>
        </div>
    </div>
    <script src="./form.js"></script>

</body>

</html>
